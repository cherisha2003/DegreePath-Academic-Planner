<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | DegreePath</title><link rel="stylesheet" href="/style.css"></head><body class="auth-body"><main class="auth-card"><span class="logo-mark">◆</span><h1>DegreePath</h1><h2>Create your account</h2><p>Start organizing your courses and planning your degree.</p><form method="POST" action="/register"><div><label for="username">Username</label><input id="username" name="username" maxlength="50" autocomplete="username" required></div><div><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div><div><label for="password">Password (at least 8 characters)</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div><button type="submit">Create account</button></form><p>Already registered? <a href="/login.html"><strong>Log in</strong></a></p></main></body></html>
